            <h2>(ip小图标)红宫</h2>
            <hr>
            <p>海丰红宫原为明代海丰学宫。1927年，海丰工农兵代表大会在这里召开，宣布成立海丰苏维埃政府。因当时会场内外布置为红色，学宫此后被称为“红宫”。如今走进这座建筑，仍能从古老的殿宇与保留的革命史迹中，了解那段发生在海陆丰的历史。</p>
            <p>游览：红宫古建筑、大成殿会场、革命文物与展陈、红场</p>
            <p>地址：汕尾市海丰县海城镇红场路13号</p>
            <a href="../index.html" class="btn btn-success mt-3">返回首页</a>
